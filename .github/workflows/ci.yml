name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    # A newer push on a branch replaces the run in progress; every commit on main gets its
    # own run. At job level on purpose: a main run waiting for the production approval would
    # hold a workflow-level group and stall every later main run.
    concurrency:
      group: check-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    # The Supabase CLI defaults to public.ecr.aws, which throttles the shared runner addresses.
    env:
      SUPABASE_INTERNAL_IMAGE_REGISTRY: ghcr.io
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - run: npm ci

      - name: Ownership check (one owner per file)
        run: |
          git fetch origin main:refs/remotes/origin/main || true
          node scripts/check-ownership.mjs --base origin/main

      - run: npm run lint

      # Vitest does not check types, so this catches type errors in tests before the slow steps.
      - run: npx tsc --noEmit

      - run: npm test

      - name: Edge Function tests (Deno)
        working-directory: supabase/functions
        run: deno task test

      - name: Task card is up to date (generated file is committed)
        run: |
          npm run build:card
          git diff --exit-code --stat -- supabase/functions/_shared/cardHtml.ts

      - name: Supabase CLI
        if: hashFiles('supabase/migrations/*.sql') != ''
        uses: supabase/setup-cli@v1
        with:
          version: 2.122.0

      # supabase start also serves the Edge Functions, which read this ignored file. The two
      # values unlock the seeded agent tokens and make the mcp function accept local tokens.
      - name: Local secrets for the served Edge Functions
        if: hashFiles('supabase/migrations/*.sql') != ''
        run: |
          sed -e 's/^AGENT_LOGIN_PEPPER=$/AGENT_LOGIN_PEPPER=local-dev-login-pepper/' \
              -e 's|^MCP_AUTH_SERVER_URL=$|MCP_AUTH_SERVER_URL=http://127.0.0.1:54321/auth/v1|' \
              supabase/functions/.env.example > supabase/functions/.env

      - name: Database tests (pgTAP)
        if: hashFiles('supabase/migrations/*.sql') != ''
        run: |
          supabase start -x studio,imgproxy,inbucket,logflare,vector
          supabase test db

      - name: Handover end-to-end
        if: hashFiles('supabase/migrations/*.sql') != ''
        run: |
          npx vitest run tests/agents/handoverE2E.test.ts tests/agents/stubWorld.test.ts
          (cd supabase/functions && deno test --allow-env --allow-net --allow-read _shared/tools/handover.test.ts)
          supabase test db supabase/tests/agents/24_handover.sql

      # The Deno tests import handlers, not entrypoints, so a function that cannot boot passed
      # them. Every function is called once (503 is a boot error; 4xx and 500 mean it answered),
      # then the MCP flow runs over HTTP with the seeded Codex agent and its queued seed task.
      - name: Served MCP smoke (every function boots, then the MCP flow)
        if: hashFiles('supabase/migrations/*.sql') != ''
        run: |
          for dir in supabase/functions/*/; do
            name=$(basename "$dir")
            [ "$name" = "_shared" ] && continue
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 120 -X POST "http://127.0.0.1:54321/functions/v1/$name" -H 'Content-Type: application/json' -d '{}')
            echo "$name $code"
            if [ "$code" = "503" ]; then echo "::error::$name does not boot"; docker logs supabase_edge_runtime_colabora-si 2>&1 | tail -20; exit 1; fi
          done
          AGENT_PAT="$(grep -oE 'agt_LOCALDEVCODEX[0-9]+' supabase/seeds/02_agents.sql | head -1)" \
          MCP_URL=http://127.0.0.1:54321/functions/v1/mcp \
          SMOKE_PAGE_ID=research-task-1 \
          SMOKE_TASK_ID=00000000-0000-4000-8000-000000000051 \
          node tests/agents/mcp-smoke.mjs

      - run: npm run build

  deploy-backend:
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Skip when the backend secrets are not configured
        id: gate
        run: |
          if [ -z "$SUPABASE_PROJECT_REF" ] || [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: supabase/setup-cli@v1
        if: steps.gate.outputs.skip == 'false'
        with:
          version: 2.122.0

      - name: Push migrations and deploy functions
        if: steps.gate.outputs.skip == 'false'
        run: |
          supabase link --project-ref "$SUPABASE_PROJECT_REF"
          supabase db push
          supabase functions deploy
