# Supabase CLI configuration.
# Only the settings the project depends on are pinned; everything else keeps
# the CLI defaults so upgrades do not fight this file.

project_id = "colabora-si-p14"

[api]
port = 60990

[studio]
port = 60993

[inbucket]
port = 60994
smtp_port = 60995
pop3_port = 60996

[analytics]
enabled = false
port = 60997

[db.pooler]
port = 60998

[edge_runtime]
inspector_port = 60999

[db]
port = 60991
shadow_port = 60992
# Same as the hosted project (Postgres 17.x) so `supabase db reset` reproduces it.
major_version = 17

[db.seed]
enabled = true
# One seed per track: the workspace (people, pages) and the agents.
sql_paths = ["./seeds/01_workspace.sql", "./seeds/02_agents.sql"]

[auth]
# Also bounds agent tokens.
jwt_expiry = 3600

[auth.mfa.totp]
# Match hosted Auth so the OAuth/MFA security boundary is exercised locally.
enroll_enabled = true
verify_enabled = true

[auth.oauth_server]
# Supabase Auth as OAuth 2.1 authorization server for chat clients.
enabled = true
authorization_url_path = "/oauth/consent"
allow_dynamic_registration = true

[functions.send-reminders]
# Called by pg_cron through pg_net with a shared secret, not by a signed-in user.
verify_jwt = false

[functions.send-email]
# Auth Send Email Hook: the hook carries its own signature.
verify_jwt = false

[functions.mcp]
# 401 + protected-resource metadata without a token; the function validates manually.
verify_jwt = false

[functions.agent-token]
# The caller presents a personal access token, not a JWT.
verify_jwt = false

[functions.agent-admin]
# Signed-in people only.
verify_jwt = true

[functions.agent-dispatch]
# pg_cron + shared secret.
verify_jwt = false

[functions.agent-webhook]
# Provider signature.
verify_jwt = false

[functions.pub-html]
# Public pages for crawlers and agents: no caller token; get_page_bundle decides what is public.
verify_jwt = false

[functions.github-webhook]
# GitHub signs each delivery; the function checks the signature.
verify_jwt = false

[functions.voice-transcribe]
# Signed-in people and the platform agent. The function reads the raw WAV.
verify_jwt = true

[functions.workspace-mcp]
verify_jwt = false
